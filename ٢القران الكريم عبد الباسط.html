<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم | مشغل احترافي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f0a;
            background-image: radial-gradient(ellipse at center, #1a2f1a 0%, #050805 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            padding: 15px;
            direction: rtl;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .player-card {
            background: rgba(10, 20, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 32px;
            padding: 30px 25px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(212, 175, 55, 0.15);
            text-align: center;
            color: #e0d5b7;
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: "﷽";
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            margin: 0 auto;
            font-size: 2.2rem;
            font-family: 'Amiri', serif;
            color: rgba(212, 175, 55, 0.25);
            letter-spacing: 6px;
            pointer-events: none;
            transform: scaleY(1.2);
        }

        /* رسالة التحميل */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, top 0.4s ease;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            top: 30px;
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .reciter-name {
            font-size: 0.9rem;
            color: #a0a080;
            margin-bottom: 25px;
            letter-spacing: 1px;
            z-index: 1;
            position: relative;
        }

        .surah-display {
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 20px 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            z-index: 1;
            position: relative;
        }

        .surah-number {
            font-size: 2.8rem;
            font-weight: 700;
            color: #d4af37;
            font-family: 'Amiri', serif;
            line-height: 1;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .surah-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5e7c6;
            margin: 5px 0;
        }

        .surah-select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 50px;
            background: rgba(20, 30, 20, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #f0e6c5;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            text-align: center;
            text-align-last: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
            margin-top: 10px;
            transition: all 0.3s;
        }

        .surah-select:hover {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .progress-area {
            margin: 25px 0 10px;
            position: relative;
            z-index: 1;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #b0a885;
            margin-bottom: 8px;
            padding: 0 5px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(to left, #d4af37 0%, #d4af37 var(--progress, 0%), rgba(212, 175, 55, 0.2) var(--progress, 0%), rgba(212, 175, 55, 0.2) 100%);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 15px #d4af37;
            border: 2px solid #0a0f0a;
            margin-top: -6px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 25px 0 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .ctrl-btn {
            background: rgba(20, 30, 20, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s;
            user-select: none;
        }

        .ctrl-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            border-color: #d4af37;
            transform: scale(1.05);
        }

        .play-btn {
            width: 65px;
            height: 65px;
            font-size: 2rem;
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .repeat-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 5px 0 15px;
            flex-wrap: wrap;
            z-index: 1;
            position: relative;
        }

        .repeat-btn {
            padding: 8px 18px;
            border-radius: 30px;
            background: rgba(20, 30, 20, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #c0a060;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .repeat-btn.active {
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
            color: #ffd966;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .extra-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 5px 10px;
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .volume-box, .speed-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 30, 20, 0.6);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .volume-box span, .speed-box span {
            font-size: 1.1rem;
            color: #d4af37;
        }

        .volume-box input[type="range"] {
            width: 70px;
            background: rgba(212, 175, 55, 0.3);
        }

        .speed-box select {
            background: transparent;
            border: none;
            color: #e0d5b7;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            background: rgba(10, 20, 10, 0.4);
            padding: 2px 5px;
            border-radius: 15px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            font-weight: 500;
            letter-spacing: 1px;
            z-index: 1;
            position: relative;
        }

        .download-btn:hover {
            background: #d4af37;
            color: #0a0f0a;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.7);
        }

        .developer-credit {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #605e4f;
            direction: ltr;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-card">
            <div class="toast" id="loadingToast">انتظر ريثما يتم تحميل السورة...</div>

            <h1 class="app-title">📖 القرآن الكريم</h1>
            <p class="reciter-name">عبد الباسط عبد الصمد - مرتل</p>

            <div class="surah-display">
                <div class="surah-number" id="surahNum">001</div>
                <div class="surah-name" id="surahName">الفاتحة</div>
                <select class="surah-select" id="surahSelect"></select>
            </div>

            <div class="progress-area">
                <div class="time-row">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
                <input type="range" id="progressBar" value="0" min="0" step="0.1">
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevSurah()" title="السورة السابقة">⏮</button>
                <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="togglePlay()" title="تشغيل / إيقاف">▶</button>
                <button class="ctrl-btn" onclick="nextSurah()" title="السورة التالية">⏭</button>
            </div>

            <!-- أزرار وضع التكرار -->
            <div class="repeat-row" id="repeatRow">
                <button class="repeat-btn active" data-mode="once">▶️ مرة واحدة</button>
                <button class="repeat-btn" data-mode="repeat">🔁 تكرار السورة</button>
                <button class="repeat-btn" data-mode="continuous">🔂 مستمر</button>
            </div>

            <div class="extra-controls">
                <div class="volume-box">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                </div>
                <div class="speed-box">
                    <span>⚡</span>
                    <select id="speedSelect">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
            </div>

            <button class="download-btn" onclick="downloadSurah()">⬇ تحميل السورة</button>
            <div class="developer-credit">علي رسول · t.me</div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const surahNames = [
            "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
            "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
            "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
            "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
            "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
            "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
            "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
            "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
            "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
            "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
            "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
            "المسد","الإخلاص","الفلق","الناس"
        ];

        const baseURL = "https://download.quranicaudio.com/quran/abdul_basit_murattal/";

        const audio = document.getElementById("audioPlayer");
        const select = document.getElementById("surahSelect");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const durationTimeEl = document.getElementById("durationTime");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const volumeSlider = document.getElementById("volumeSlider");
        const speedSelect = document.getElementById("speedSelect");
        const surahNumEl = document.getElementById("surahNum");
        const surahNameEl = document.getElementById("surahName");
        const loadingToast = document.getElementById("loadingToast");
        const repeatBtns = document.querySelectorAll(".repeat-btn");

        let currentSurah = 1;
        let isPlaying = false;
        let repeatMode = "once"; // once, repeat, continuous
        let isLoading = false;

        // === وظائف مساعدة ===
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }

        function showToast(msg) {
            loadingToast.textContent = msg;
            loadingToast.classList.add("show");
            setTimeout(() => loadingToast.classList.remove("show"), 2500);
        }

        function updateRepeatButtons() {
            repeatBtns.forEach(btn => {
                const mode = btn.dataset.mode;
                btn.classList.toggle("active", mode === repeatMode);
            });
        }

        // === تعبئة القائمة ===
        surahNames.forEach((name, idx) => {
            const opt = document.createElement("option");
            opt.value = idx + 1;
            opt.text = `${idx + 1} - ${name}`;
            select.appendChild(opt);
        });

        // === تحميل آخر سورة ===
        const saved = localStorage.getItem("lastSurah");
        if (saved && !isNaN(saved) && saved >= 1 && saved <= 114) currentSurah = +saved;
        select.value = currentSurah;

        function updateDisplay() {
            surahNumEl.textContent = currentSurah.toString().padStart(3, '0');
            surahNameEl.textContent = surahNames[currentSurah - 1];
            localStorage.setItem("lastSurah", currentSurah);
        }
        updateDisplay();

        function loadSurah(num) {
            const padded = num.toString().padStart(3, '0');
            audio.src = baseURL + padded + ".mp3";
            audio.load();
            currentSurah = num;
            updateDisplay();
            progressBar.value = 0;
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "00:00";
            if (isPlaying) {
                playAudioWithLoadingCheck();
            }
        }

        // === تشغيل مع مراعاة التحميل ===
        function playAudioWithLoadingCheck() {
            if (audio.readyState >= 3) { // HAVE_FUTURE_DATA or more
                audio.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = "⏸";
                }).catch(err => alert("تعذر التشغيل: " + err.message));
            } else {
                // جاري التحميل
                isLoading = true;
                playPauseBtn.textContent = "⏳";
                showToast("انتظر ريثما يتم تحميل السورة...");
                audio.addEventListener("canplay", function readyHandler() {
                    audio.removeEventListener("canplay", readyHandler);
                    if (isLoading) {
                        isLoading = false;
                        audio.play().then(() => {
                            isPlaying = true;
                            playPauseBtn.textContent = "⏸";
                        }).catch(() => {});
                    }
                });
            }
        }

        function togglePlay() {
            if (!audio.src || audio.src === window.location.href) {
                loadSurah(currentSurah);
                // will call play after load
                isPlaying = true; // assume we want to play
                playAudioWithLoadingCheck();
                return;
            }
            if (audio.paused) {
                playAudioWithLoadingCheck();
            } else {
                audio.pause();
                isPlaying = false;
                playPauseBtn.textContent = "▶";
                isLoading = false;
            }
        }

        // === التنقل ===
        function nextSurah() {
            if (currentSurah < 114) {
                currentSurah++;
                select.value = currentSurah;
                loadSurah(currentSurah);
                if (isPlaying) playAudioWithLoadingCheck();
            }
        }

        function prevSurah() {
            if (currentSurah > 1) {
                currentSurah--;
                select.value = currentSurah;
                loadSurah(currentSurah);
                if (isPlaying) playAudioWithLoadingCheck();
            }
        }

        function downloadSurah() {
            const num = currentSurah.toString().padStart(3, '0');
            window.open(baseURL + num + ".mp3", "_blank");
        }

        // === أحداث الصوت ===
        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                progressBar.value = audio.currentTime;
                progressBar.style.setProperty('--progress', (audio.currentTime / audio.duration) * 100 + '%');
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener("loadedmetadata", () => {
            progressBar.max = audio.duration;
            durationTimeEl.textContent = formatTime(audio.duration);
            progressBar.style.setProperty('--progress', '0%');
        });

        progressBar.addEventListener("input", () => {
            audio.currentTime = progressBar.value;
            progressBar.style.setProperty('--progress', (audio.currentTime / audio.duration) * 100 + '%');
        });

        volumeSlider.addEventListener("input", () => audio.volume = volumeSlider.value);
        speedSelect.addEventListener("change", () => audio.playbackRate = parseFloat(speedSelect.value));

        select.addEventListener("change", () => {
            currentSurah = parseInt(select.value);
            loadSurah(currentSurah);
            if (isPlaying) playAudioWithLoadingCheck();
        });

        // === التكرار ===
        audio.addEventListener("ended", () => {
            if (repeatMode === "repeat") {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                isPlaying = true;
                playPauseBtn.textContent = "⏸";
            } else if (repeatMode === "continuous") {
                nextSurah();
                // nextSurah تستدعي loadSurah ثم إذا isPlaying تشغّل
                if (isPlaying) {
                    // سيتم التشغيل من داخل loadSurah/playAudioWithLoadingCheck
                }
            } else { // once
                isPlaying = false;
                playPauseBtn.textContent = "▶";
                progressBar.value = 0;
                progressBar.style.setProperty('--progress', '0%');
                currentTimeEl.textContent = "00:00";
            }
        });

        // === أزرار وضع التكرار ===
        repeatBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                repeatMode = btn.dataset.mode;
                updateRepeatButtons();
            });
        });

        // التهيئة الأولى
        loadSurah(currentSurah);
        audio.volume = 1;
        volumeSlider.value = 1;
        updateRepeatButtons();
    </script>
</body>
</html>
